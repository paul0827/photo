<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日誌照片選擇</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#243d31;font-family:system-ui,"Microsoft JhengHei",sans-serif}header{padding:22px 6%;background:#fffdf8;border-bottom:1px solid #dde5d9;display:flex;justify-content:space-between;align-items:center;gap:16px}header a{text-decoration:none;color:inherit;font-weight:750;font-size:20px}header span{font-size:12px;color:#7c8b75}.wrap{max-width:1300px;margin:auto;padding:40px 28px 110px}h1{font-size:32px;margin:0 0 12px}p{line-height:1.8;color:#71806c}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid #dae3d3}input,select,button{font:inherit;border:1px solid #d7e0d0;border-radius:9px;background:white;color:#294735;padding:12px 16px}button{cursor:pointer}button.active{background:#e4edda;border-color:#8ca777}input{flex:1;min-width:150px}.folders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:24px}.folder{display:block;text-align:left;padding:20px;text-decoration:none;border:1px solid #dce5d4;border-radius:14px;background:white;color:inherit}.folder img{width:100%;height:130px;object-fit:cover;border-radius:8px;margin-bottom:14px}.folder strong{display:block;font-size:17px}.folder span{display:block;color:#809075;font-size:12px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:24px}.card{background:white;border:2px solid transparent;border-radius:13px;overflow:hidden;position:relative}.card.picked{border-color:#5f814b}.photo{border:0;padding:0;border-radius:0;width:100%;display:block;cursor:zoom-in;background:#e8ecdF}.photo img{display:block;width:100%;height:240px;object-fit:cover}.card label{position:absolute;top:10px;right:10px;padding:7px;background:#fffffff0;border-radius:8px;cursor:pointer}.card input{accent-color:#466a36;width:22px;height:22px;margin:0}.caption{padding:12px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{position:fixed;bottom:0;left:0;right:0;background:#fffdf8ee;backdrop-filter:blur(10px);border-top:1px solid #dce5d4;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;gap:15px}.bar strong{font-size:24px}.bar span{font-size:13px;color:#6c8063}.empty{text-align:center;padding:60px 20px;color:#809075}.back{display:inline-block;margin-bottom:24px;color:#6f8165;font-size:14px;text-decoration:none}dialog{border:0;border-radius:14px;max-width:96vw;max-height:96vh;padding:18px;background:#fffdf8;width:1100px}dialog::backdrop{background:#112219cf}dialog img{max-width:100%;max-height:76vh;object-fit:contain;display:block;margin:15px auto}dialog .top{display:flex;justify-content:space-between;align-items:center;gap:10px}#message{font-size:13px;color:#6e8063}.hidden{display:none!important}@media(max-width:1000px){.folders,.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo img{height:210px}}@media(max-width:700px){header{padding:18px 20px}header span{display:none}.wrap{padding:28px 18px 105px}.folders,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photo img{height:180px}.folder{padding:14px}.folder img{height:105px}h1{font-size:27px}.bar{padding:14px 18px}}@media(max-width:370px){.grid,.folders{grid-template-columns:1fr}}
</style></head><body><header><a href="./">◈ 日誌照片選擇</a><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><span>找到照片，勾選希望使用的那幾張。</span><div id="adminTools"></div></div></header><main class="wrap"><div id="content" class="empty">正在載入照片…</div></main><div id="bar" class="bar hidden"><div><strong id="count">0</strong> <span>張已選</span></div><span id="message" role="status">勾選後會自動儲存</span></div><dialog id="viewer"><div class="top"><strong id="viewname"></strong><button onclick="document.querySelector('#viewer').close()">關閉 ✕</button></div><img id="viewimg" alt="照片大圖"></dialog><script>
const $=s=>document.querySelector(s),aid=new URLSearchParams(location.search).get('album');let album,folders=[],selected=new Set(),filter=false,search='',draft={},revision=0,savedRevision=0,saving=false,timer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(new URL(path,'https://photo-picks-studio.silky-coin-2718.chatgpt.site'),opt),s=await r.json();if(!r.ok)throw Error(s.error||'暫時無法讀取');return s;}
function folderGrid(){const match=folders.filter(f=>f.title.toLowerCase().includes(search.toLowerCase()));$('#folders').innerHTML=match.map(f=>'<a class="folder" href="./?album='+f.id+'">'+(f.cover?'<img loading="lazy" src="https://photo-picks-studio.silky-coin-2718.chatgpt.site/image/'+f.id+'/'+f.cover+'" alt="'+esc(f.title)+' 的照片">':'')+'<strong>'+esc(f.title)+'</strong><span>'+f.photoCount+' 張照片 · 開始選擇 →</span></a>').join('')||'<div class="empty">沒有符合的資料夾。</div>';}
async function home(){folders=await api('/api/gallery');$('#content').className='';$('#content').innerHTML='<h1>挑選希望放入日誌的照片</h1><p>先找到自己的資料夾，再勾選希望使用的照片。</p><div class="toolbar"><input type="search" aria-label="搜尋姓名或資料夾" placeholder="搜尋姓名或資料夾…" oninput="search=this.value;folderGrid()"><span>'+folders.length+' 個資料夾</span></div><div class="folders" id="folders"></div>';folderGrid();}
function persist(){draft={...draft,selected:[...selected],pending:revision>savedRevision};try{localStorage.setItem('simple-picks:'+aid,JSON.stringify(draft));}catch{$('#message').textContent='此瀏覽器無法保存草稿，請保持網頁開啟。';}}
function render(){const match=album.photos.filter(p=>(!filter||selected.has(p.id))&&p.name.toLowerCase().includes(search.toLowerCase()));$('#grid').innerHTML=match.map(p=>'<article class="card '+(selected.has(p.id)?'picked':'')+'"><button class="photo" aria-label="查看 '+esc(p.name)+' 大圖" onclick="preview(\''+p.id+'\')"><img loading="lazy" src="https://photo-picks-studio.silky-coin-2718.chatgpt.site/image/'+aid+'/'+p.id+'" alt="'+esc(p.name)+'"></button><label><input type="checkbox" aria-label="選取 '+esc(p.name)+'" '+(selected.has(p.id)?'checked':'')+' onchange="mark(\''+p.id+'\',this.checked)"></label><div class="caption" title="'+esc(p.name)+'">'+esc(p.name)+'</div></article>').join('')||'<div class="empty">'+(filter?'尚未選擇照片。':'沒有符合的照片。')+'</div>';$('#count').textContent=selected.size;$('#picked').classList.toggle('active',filter);}
function preview(id){const p=album.photos.find(p=>p.id===id);$('#viewname').textContent=p.name;$('#viewimg').src='https://photo-picks-studio.silky-coin-2718.chatgpt.site/image/'+aid+'/'+id;$('#viewimg').alt=p.name;$('#viewer').showModal();}
function mark(id,on){on?selected.add(id):selected.delete(id);revision++;persist();$('#message').textContent='正在儲存選擇…';render();clearTimeout(timer);timer=setTimeout(save,400);}
async function save(){if(saving||savedRevision===revision)return;saving=true;const version=revision,choices=[...selected];try{await api('/api/albums/'+aid+'/submissions',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:draft.token,name:album.title,selected:choices})});savedRevision=version;persist();$('#message').textContent=savedRevision===revision?'選擇已自動儲存 ✓':'正在儲存選擇…';}catch{$('#message').innerHTML='暫時無法儲存 · <button onclick="save()">重試</button>';return;}finally{saving=false;}if(savedRevision<revision)save();}
async function photos(){album=await api('/api/albums/'+aid);try{draft=JSON.parse(localStorage.getItem('simple-picks:'+aid)||'{}');}catch{}draft.token=draft.token||crypto.randomUUID();selected=new Set((draft.selected||[]).filter(id=>album.photos.some(p=>p.id===id)));if(draft.pending)revision=1;$('#content').className='';$('#content').innerHTML='<a class="back" href="./">← 回到所有資料夾</a><h1>'+esc(album.title)+'</h1><p>勾選希望放入日誌的照片。點擊照片可以放大查看。</p><div class="toolbar"><button id="picked" onclick="filter=!filter;render()">只看已選</button><input type="search" aria-label="搜尋照片檔名" placeholder="搜尋照片檔名…" oninput="search=this.value;render()"><span>'+album.photos.length+' 張照片</span></div><div class="grid" id="grid"></div>';$('#bar').classList.remove('hidden');render();if(draft.pending)save();}
function adminTools(){document.querySelector('#adminTools').innerHTML='<a style="font-size:14px" target="_top" href="https://photo-picks-studio.silky-coin-2718.chatgpt.site/?admin=1">管理員登入與匯出 Excel →</a>';}
adminTools();
window.addEventListener('beforeunload',e=>{if(revision>savedRevision){e.preventDefault();e.returnValue='';}});window.addEventListener('online',save);(aid?photos():home()).catch(e=>{$('#content').textContent=e.message;});
</script></body></html>
